name: Source validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.14.1'
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Validate exact committed source and emit inventory
        run: node scripts/validate-source.mjs --output artifacts/ci-source
      - name: Save diagnostic summary
        if: always()
        run: node scripts/source-diagnostics.mjs --output artifacts/ci-diagnostic.json
      - name: Upload summaries only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-source/summary.json
            artifacts/ci-source/source-manifest.json
            artifacts/ci-diagnostic.json
          if-no-files-found: error
          retention-days: 7
