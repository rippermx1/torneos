name: torneos
services:
  app:
    image: torneos-app:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORNEOS_ENVIRONMENT: ${TORNEOS_ENVIRONMENT:-local}
        PRODUCTION_SUPABASE_PROJECT_REF: ${PRODUCTION_SUPABASE_PROJECT_REF:-}
        STAGING_SUPABASE_PROJECT_REF: ${STAGING_SUPABASE_PROJECT_REF:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Define la URL de Supabase para el navegador}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-true}
    env_file:
      - ${TORNEOS_RUNTIME_ENV_FILE:-.env.local}
    environment:
      TORNEOS_ENVIRONMENT: ${TORNEOS_ENVIRONMENT:-local}
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-true}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      APP_URL: ${APP_URL:-http://127.0.0.1:3081}
    ports:
      - "${TORNEOS_BIND_IP:-127.0.0.1}:${TORNEOS_PORT:-3081}:3000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/play').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
