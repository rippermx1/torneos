# Supabase is managed by the pinned CLI; this override keeps one app container.
services:
  app:
    networks: [default, supabase_local]
    environment:
      SUPABASE_SERVER_URL: http://supabase_kong_torneos:8000
      LOCAL_EMAIL_API_URL: http://supabase_inbucket_torneos:8025/api/v1/send
    volumes:
      - local_flow_data:/app/.local-flow
volumes:
  local_flow_data:
networks:
  supabase_local:
    external: true
    name: supabase_network_torneos
