<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SnakeArena · TorneosPlay</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101a}canvas{display:block;width:100%;height:100%;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-items:center;color:#b5d8dc;font:16px system-ui;pointer-events:none}</style></head>
<body><canvas id="canvas" tabindex="0" aria-label="Arena multiplayer: dirige con mouse o arrastre"></canvas><div id="loading">Cargando arena…</div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
let unity;
const publish=data=>parent.postMessage({channel:'torneos.snake-arena',version:1,build:'snake-arena-014',data},location.origin);
const canvas=document.getElementById('canvas');
canvas.addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'&&event.button===0&&unity){canvas.setPointerCapture(event.pointerId);unity.SendMessage('SnakeArena','SetBoost','1');}});
for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,event=>{if(event.pointerType==='mouse'&&unity)unity.SendMessage('SnakeArena','SetBoost','0')});
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.channel!=='torneos.snake-arena'||event.data.version!==1||!unity)return;const type=event.data.type;if(type==='quality'&&['high','balanced','low'].includes(event.data.quality)){unity.SendMessage('SnakeArena','SetQuality',event.data.quality);return;}if(type==='appearance'&&['aurora','nebula','solar','comet','eclipse','prism'].includes(event.data.appearance)){unity.SendMessage('SnakeArena','SetAppearance',event.data.appearance);return;}if(type==='boost'&&typeof event.data.held==='boolean'){unity.SendMessage('SnakeArena','SetBoost',event.data.held?'1':'0');return;}if(type==='style'&&['rings','smooth'].includes(event.data.style)){unity.SendMessage('SnakeArena','SetStyle',event.data.style);return;}if(type==='authenticate'&&typeof event.data.ticket==='string'&&event.data.ticket.length<900){unity.SendMessage('SnakeArena','Authenticate',JSON.stringify({v:1,type:'authenticate',ticket:event.data.ticket}));return;}if(type==='drop'||type==='leave'){unity.SendMessage('SnakeArena',type==='drop'?'SimulateDrop':'Leave','');return;}if(type==='join'||type==='restart'){unity.SendMessage('SnakeArena',type==='join'?'Join':'Restart',type==='join'?JSON.stringify({appearance:['aurora','nebula','solar','comet','eclipse','prism'].includes(event.data.appearance)?event.data.appearance:undefined,ticket:typeof event.data.ticket==='string'?event.data.ticket:undefined,resumeOnly:event.data.resumeOnly===true}):(['aurora','nebula','solar','comet','eclipse','prism'].includes(event.data.appearance)?event.data.appearance:''));canvas.focus({preventScroll:true});}});
createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',companyName:'TorneosPlay',productName:'SnakeArena',productVersion:'0.1.0',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(devicePixelRatio,1.5)},progress=>{document.getElementById('loading').textContent='Cargando arena… '+Math.round(progress*100)+'%'}).then(instance=>{unity=instance;document.getElementById('loading').remove();publish({v:1,type:'ready'});}).catch(()=>{document.getElementById('loading').textContent='No se pudo cargar la arena';publish({v:1,type:'error',code:'webgl_load_failed'})});
addEventListener('blur',()=>{if(unity)unity.SendMessage('SnakeArena','SetBoost','0')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&unity)unity.SendMessage('SnakeArena','SetBoost','0')});
addEventListener('pagehide',()=>{if(unity)unity.Quit()});
</script></body></html>
